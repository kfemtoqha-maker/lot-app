<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사출 LOT 기록</title>
<meta name="theme-color" content="#1F3F7A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LOT 기록">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#E8EDF0; --surface:#FFFFFF; --sunk:#DAE2E7; --ink:#15212D; --ink2:#546371; --line:#C3CED6;
  --brand:#1F3F7A; --brand-ink:#FFFFFF; --brand-soft:#D6E0F1;
  --ok:#17744F; --ok-bg:#DAF0E5; --ng:#C0381F; --ng-bg:#FBE1DA; --warn:#8E5B00; --warn-bg:#F9ECCF;
  --radius-l:14px; --radius-s:8px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151C; --surface:#16212C; --sunk:#0A1016; --ink:#E3E9EF; --ink2:#93A2B0; --line:#293847;
    --brand:#86A9E6; --brand-ink:#0A1322; --brand-soft:#1D2D48;
    --ok:#5BC894; --ok-bg:#12321F; --ng:#FF8C75; --ng-bg:#3A1912; --warn:#E6B25A; --warn-bg:#382A0F;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#16212C; --sunk:#0A1016; --ink:#E3E9EF; --ink2:#93A2B0; --line:#293847;
  --brand:#86A9E6; --brand-ink:#0A1322; --brand-soft:#1D2D48;
  --ok:#5BC894; --ok-bg:#12321F; --ng:#FF8C75; --ng-bg:#3A1912; --warn:#E6B25A; --warn-bg:#382A0F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
a{color:inherit}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.top h1{font-size:19px;font-weight:700;margin:0;flex:1;letter-spacing:-.01em}
.back{border:0;background:none;padding:6px 8px 6px 0;font-size:16px;color:var(--brand);font-weight:600;cursor:pointer}
.sync{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.sync.on i{background:var(--ok)}
.sync.off i{background:var(--ng)}
button.sync{border:0;background:none;padding:6px 0;cursor:pointer;font:inherit;font-size:12px;color:var(--ink2)}

main{max-width:640px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}

/* list */
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface);font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.count{font-size:13px;color:var(--ink2);margin:10px 2px 8px}
.lot{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:var(--radius-s);padding:12px 14px;margin-bottom:10px}
.lot-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lot-no{font-size:18px;font-weight:700;letter-spacing:.02em}
.lot-date{font-size:13px;color:var(--ink2)}
.lot-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.pill{font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink);font-weight:500}
.pill.stage{background:var(--brand-soft);color:var(--brand);font-weight:700}
.pill.ok{background:var(--ok-bg);color:var(--ok);font-weight:600}
.pill.ng{background:var(--ng-bg);color:var(--ng);font-weight:600}
.pill.warn{background:var(--warn-bg);color:var(--warn);font-weight:600}
.empty{text-align:center;padding:48px 20px;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}

/* lot tag */
.tag{position:relative;background:var(--brand);color:var(--brand-ink);border-radius:var(--radius-l);padding:16px 18px 16px 34px;margin-bottom:16px;overflow:hidden}
.tag::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:8px;background:radial-gradient(circle,var(--bg) 3.2px,transparent 3.6px) 0 4px/8px 14px repeat-y}
.tag small{display:block;font-size:12.5px;opacity:.8}
.tag .no{font-size:28px;font-weight:700;letter-spacing:.04em;line-height:1.2;word-break:break-all}
.tag .no input{all:unset;width:100%;font-size:28px;font-weight:700;letter-spacing:.04em;border-bottom:2px dashed currentColor;padding-bottom:2px}
.tag .sub{margin-top:6px;font-size:14.5px;opacity:.92}

/* sections */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:14px 14px 16px;margin-bottom:14px}
.sec h2{font-size:15.5px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec h3{font-size:13.5px;color:var(--ink2);font-weight:600;margin:14px 0 8px}
.sec h3:first-of-type{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px 12px}
.f label{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--bg);font-size:16px;min-height:44px}
.f textarea{min-height:90px;resize:vertical}
.u{position:relative}
.u input{padding-right:46px}
.u span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--ink2);pointer-events:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--ng);border-color:var(--ng)}
.btn.small{min-height:34px;padding:5px 10px;font-size:13.5px}
.btn.wide{width:100%}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1}
.yield{margin-top:12px;font-size:14px;color:var(--ink2)}
.yield b{color:var(--ink);font-size:18px}
.bar{height:8px;border-radius:4px;background:var(--ng-bg);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}

.dim{display:grid;grid-template-columns:1fr 104px 46px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.dim:first-child{border-top:0}
.dim .nm{font-size:14.5px;font-weight:600}
.dim .sp{font-size:12.5px;color:var(--ink2)}
.dim input{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--bg);font-size:16px;text-align:right;min-height:40px}
.jd{font-size:12.5px;font-weight:700;text-align:center;border-radius:6px;padding:4px 0}
.jd.OK{background:var(--ok-bg);color:var(--ok)}
.jd.NG{background:var(--ng-bg);color:var(--ng)}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12.5px;color:var(--ink2);font-weight:600}
dl.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px 14px;margin:0}
dl.kv div{min-width:0}
dl.kv dt{font-size:12.5px;color:var(--ink2)}
dl.kv dd{margin:0;font-weight:600;word-break:break-all}
.memo{white-space:pre-wrap;margin:0}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:var(--radius-s);overflow:hidden;background:var(--sunk);border:0;padding:0;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:0;font-size:16px;line-height:28px;cursor:pointer}
.addph{display:flex;align-items:center;justify-content:center;flex-direction:column;border:2px dashed var(--line);background:none;color:var(--ink2);font-size:13px;gap:2px}
.addph b{font-size:26px;line-height:1}
.note{font-size:13px;color:var(--ink2);margin:6px 0 0}
.help{font-size:13px;color:var(--ink2);margin:0 0 8px}
.f textarea.code{font-size:14px;line-height:1.55;min-height:220px;white-space:pre;overflow-x:auto}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;padding:8px 12px;gap:8px}
.tab{display:flex;flex-direction:column;align-items:center;text-decoration:none;font-size:12.5px;color:var(--ink2);padding:4px 0;gap:2px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--brand);font-weight:700}
.tab.new{flex-direction:row;justify-content:center;background:var(--brand);color:var(--brand-ink);border-radius:999px;font-size:15px;font-weight:700;padding:11px 0}
.tab.new svg{width:18px;height:18px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(5,10,15,.86);z-index:30;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));flex-direction:column;gap:12px}
.overlay img{max-height:80vh;border-radius:8px}
.overlay textarea{width:100%;max-width:600px;height:60vh;font-size:12px;border-radius:8px;padding:10px;background:var(--surface)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="top-in" id="top"></div></header>
<main id="main"></main>
<nav class="tabbar" aria-label="메뉴"><div class="tabbar-in">
  <a class="tab" href="#/" data-tab="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>LOT 목록</a>
  <a class="tab new" href="#/new" data-tab="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>&nbsp;새 LOT</a>
  <a class="tab" href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>설정</a>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- defaults ---------- */
const DEFAULT_PARTS = `# [프로젝트 / 부품 / 고객 / 재료]
# 항목, 기준값, +공차, -공차
[MBTi / LENS1 / LGE / T62R]
장축 외경, 91.4, +0.1, -0.1
단축 외경, 51.6, +0.1, -0.1
중심 두께, 44.25, +0.02, -0.02
좌 Hole Ø, 4.1, +0.02, -0.02
우 Hole Ø, 4.1, +0.02, -0.02
플랜지, 10, +0.02, -0.02
Hole 간격, 81, +0.05, -0.05
장축 CA, 69.8, +0.05, -0.05
단축 CA, 40.8, +0.05, -0.05
플랜지 Hole, 4, +0.5, 0
파팅~CS1, 18.25, +0.02, -0.02
S1 PV(㎛), 0, +10, 0
S2 PV(㎛), 0, +10, 0
S1 Ra(nm), 0, +2, 0
S2 Ra(nm), 0, +2, 0

[MBTi / LENS2 / LGE / T62R]
장축 외경, 96.9, +0.1, -0.1
단축 외경, 58, +0.1, -0.1
중심 두께, 26.67, +0.02, -0.02
좌 Hole Ø, 4.1, +0.02, -0.02
우 Hole Ø, 4.1, +0.02, -0.02
플랜지, 10, +0.02, -0.02
Hole 간격, 87, +0.05, -0.05
장축 CA, 79, +0.05, -0.05
단축 CA, 48.2, +0.05, -0.05
플랜지 Hole, 4, +0.5, 0
파팅~CS1, 9, +0.02, -0.02
S1 PV(㎛), 0, +10, 0
S2 PV(㎛), 0, +10, 0
S1 Ra(nm), 0, +2, 0
S2 Ra(nm), 0, +2, 0`;

const DEFAULT_CONDS = `# 그룹 | 항목 | 단위
건조 | 건조 온도 | ℃
건조 | 건조 시간 | h
온도 | 노즐 | ℃
온도 | H1 | ℃
온도 | H2 | ℃
온도 | H3 | ℃
온도 | H4 | ℃
온도 | 금형 고정측 | ℃
온도 | 금형 가동측 | ℃
사출 | 사출 속도 | mm/s
사출 | 사출 압력 | MPa
사출 | V-P 전환 | mm
사출 | 보압 | MPa
사출 | 보압 시간 | s
사출 | 계량 위치 | mm
사출 | 쿠션량 | mm
사이클 | 냉각 시간 | s
사이클 | 사이클 타임 | s`;

const DEFAULT_DEFECTS = '웰드라인, 플로우마크, 가스마크, 싱크마크, 미성형, 버, 기포, 은줄, 이물, 스크래치, 크랙';
const STAGES = ['T0','T1','T2','T3','T4','양산'];
const STATUSES = ['성형완료','측정중','납품','보류','폐기'];
const LS_KEY = 'lotbook.v1';

/* ---------- utils ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v === '' || v == null) return null; const t = String(v).trim().replace(/[^0-9.+\-eE]/g,''); if (!t) return null; const n = Number(t); return Number.isFinite(n) ? n : null; };
const fmt = n => n == null ? '' : String(Number(Number(n).toFixed(4)));
const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + fmt(Math.abs(n));
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const nowIso = () => new Date().toISOString();
const ID_OK = /^[A-Za-z0-9_\-.~:@+]+$/;
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2400); }

function parseParts(text){
  const out=[]; let cur=null;
  (text||'').split('\n').forEach(raw=>{
    const line=raw.trim(); if(!line||line.startsWith('#')) return;
    const h=line.match(/^\[(.+)\]$/);
    if(h){ const [project='',part='',customer='',material='']=h[1].split('/').map(s=>s.trim()); cur={project,part,customer,material,dims:[]}; out.push(cur); return; }
    if(!cur) return;
    const [name,nom,plus,minus]=line.split(',').map(s=>s.trim());
    const n=num(nom); if(!name||n==null) return;
    cur.dims.push({name,nominal:n,plus:num(plus)??0,minus:num(minus)??0});
  });
  return out;
}
function parseConds(text){
  return (text||'').split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#')).map(l=>{ const [g='',label='',u='']=l.split('|').map(s=>s.trim()); return label?{g,l:label,u}:null; }).filter(Boolean);
}
const parseList = text => (text||'').split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
const partKey = (p) => `${p.project}/${p.part}`;
function judge(d){ if(d.value==null) return null; const lo=d.nominal+Math.min(d.minus,0), hi=d.nominal+Math.max(d.plus,0), e=1e-9; return (d.value>=lo-e&&d.value<=hi+e)?'OK':'NG'; }
function specText(d){ const p=d.plus, m=d.minus; if(Math.abs(p)===Math.abs(m)&&p!==0) return `${fmt(d.nominal)} ±${fmt(Math.abs(p))}`; return `${fmt(d.nominal)} ${p>=0?'+':''}${fmt(p)} / ${m>0?'+':''}${fmt(m)}`; }
function yieldOf(l){ const g=l.good, n=l.ng; if(g!=null&&n!=null&&g+n>0) return g/(g+n)*100; if(g!=null&&l.shots) return g/l.shots*100; return null; }

/* ---------- state & storage (IndexedDB, 이 기기에 저장) ---------- */
const S = { lots:[], settings:null, filter:'all', q:'', persisted:null, conn:{}, syncState:'idle', syncing:false };
const URLS = new Map();

function cfg(){
  const s=S.settings||{};
  const partsText=s.partsText??DEFAULT_PARTS, condsText=s.condsText??DEFAULT_CONDS, defectsText=s.defectsText??DEFAULT_DEFECTS;
  return { prefix:s.prefix||'AGO', partsText, condsText, defectsText, parts:parseParts(partsText), conds:parseConds(condsText), defects:parseList(defectsText) };
}
const IDB = {
  db:null,
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open('lotbook',1);
    r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore('lots',{keyPath:'id'}); d.createObjectStore('photos',{keyPath:'id'}); d.createObjectStore('kv'); };
    r.onsuccess=()=>{ this.db=r.result; res(); }; r.onerror=()=>rej(r.error); }); },
  run(store, mode, fn){ return new Promise((res,rej)=>{ const t=this.db.transaction(store,mode); const out=fn(t.objectStore(store));
    t.oncomplete=()=>res(out instanceof IDBRequest ? out.result : undefined); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); },
  all:(st)=>IDB.run(st,'readonly',s=>s.getAll()),
  get:(st,k)=>IDB.run(st,'readonly',s=>s.get(k)),
  put:(st,v,k)=>IDB.run(st,'readwrite',s=>k===undefined?s.put(v):s.put(v,k)),
  del:(st,k)=>IDB.run(st,'readwrite',s=>s.delete(k)),
  keys:(st)=>IDB.run(st,'readonly',s=>s.getAllKeys()),
};
const Store = {
  async load(){ S.lots=await IDB.all('lots'); S.settings=(await IDB.get('kv','settings'))||null; },
  async saveLot(lot, oldId){
    const id=lot.lotNo;
    if(oldId && oldId!==id){ await IDB.del('lots', oldId); await tombstone(oldId); }
    await untomb(id);
    await IDB.put('lots', {...lot, id});
    S.lots=S.lots.filter(l=>l.id!==oldId&&l.id!==id); S.lots.push({...lot,id});
    scheduleSync();
  },
  async deleteLot(id){
    const l=S.lots.find(x=>x.id===id);
    await IDB.del('lots', id); await tombstone(id);
    S.lots=S.lots.filter(x=>x.id!==id); scheduleSync();
    for(const p of (l?.photos||[])) await delPhoto(p);
  },
  async saveSettings(s){ s={...s, updatedAt:nowIso()}; S.settings=s; await IDB.put('kv', s, 'settings'); scheduleSync(); }
};
async function addPhoto(blob){ const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); await IDB.put('photos',{id,blob,type:blob.type||'image/jpeg'}); return id; }
async function delPhoto(id){ if(S.lots.some(l=>(l.photos||[]).includes(id))) return; await IDB.del('photos',id); const u=URLS.get(id); if(u){ URL.revokeObjectURL(u); URLS.delete(id); } }
async function photoUrl(id){ if(URLS.has(id)) return URLS.get(id); const r=await IDB.get('photos',id); if(!r) return ''; const u=URL.createObjectURL(r.blob); URLS.set(id,u); return u; }
function hydratePhotos(root=document){ $$('img[data-pid]',root).forEach(async img=>{ const u=await photoUrl(img.dataset.pid); if(u) img.src=u; else img.alt='사진 없음'; }); }
async function cleanupPhotos(){ try{ const used=new Set(S.lots.flatMap(l=>l.photos||[])); for(const k of await IDB.keys('photos')) if(!used.has(k)) await IDB.del('photos',k); }catch(e){} }

function saveFile(name, blob){
  const file=new File([blob], name, {type:blob.type});
  if(matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({files:[file]})){
    return navigator.share({files:[file], title:name}).catch(()=>{});
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const blobToB64 = b => new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]); fr.onerror=rej; fr.readAsDataURL(b); });
const b64ToBlob = (b64,type) => { const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type}); };

async function exportBackup(){
  toast('백업 파일을 만드는 중입니다');
  const photos=[]; for(const r of await IDB.all('photos')) photos.push({id:r.id, type:r.type, data:await blobToB64(r.blob)});
  const data={app:'lotbook', version:1, exportedAt:nowIso(), settings:S.settings, lots:S.lots.map(({id,...l})=>l), photos};
  saveFile(`사출LOT_백업_${today()}.json`, new Blob([JSON.stringify(data)],{type:'application/json'}));
}
async function importBackup(file){
  let data; try{ data=JSON.parse(await file.text()); }catch(e){ toast('백업 파일을 읽지 못했습니다'); return; }
  if(data.app!=='lotbook' || !Array.isArray(data.lots)){ toast('이 앱의 백업 파일이 아닙니다'); return; }
  let added=0, replaced=0;
  for(const p of (data.photos||[])){ try{ await IDB.put('photos',{id:p.id, type:p.type, blob:b64ToBlob(p.data,p.type||'image/jpeg')}); }catch(e){} }
  for(const l of data.lots){ if(!l.lotNo||!ID_OK.test(l.lotNo)) continue; S.lots.some(x=>x.id===l.lotNo)?replaced++:added++; await IDB.put('lots',{...l,id:l.lotNo}); }
  if(data.settings && !S.settings) await Store.saveSettings(data.settings);
  await Store.load();
  toast(`복원 완료: 새 LOT ${added}건, 덮어쓴 LOT ${replaced}건`); scheduleSync();
  render();
}

/* ---------- PC 동기화 ---------- */
async function tombstone(id){ const t=(await IDB.get('kv','tombstones'))||{}; t[id]=nowIso(); await IDB.put('kv',t,'tombstones'); }
async function untomb(id){ const t=(await IDB.get('kv','tombstones'))||{}; if(t[id]){ delete t[id]; await IDB.put('kv',t,'tombstones'); } }
const normUrl=u=>{ u=(u||'').trim().replace(/\/+$/,''); if(u&&!/^https?:\/\//i.test(u)) u='https://'+u; return u; };
async function saveConn(patch){ S.conn={...S.conn,...patch}; await IDB.put('kv',S.conn,'conn'); }
async function api(path, opt={}, timeout=8000){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),timeout);
  const headers={'X-Token':S.conn.token||'', ...(typeof opt.body==='string'?{'Content-Type':'application/json'}:{}), ...(opt.headers||{})};
  try{
    const r=await fetch(S.conn.url+path,{...opt, headers, signal:ctl.signal, cache:'no-store'});
    if(r.status===401) throw {code:'auth'};
    if(!r.ok) throw {code:'http'+r.status};
    return r;
  }catch(e){ if(e&&e.code) throw e; throw {code: e&&e.name==='AbortError'?'timeout':'network'}; }
  finally{ clearTimeout(t); }
}
const localTime = t => t ? new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
function ago(t){ if(!t) return ''; const s=(Date.now()-Date.parse(t))/1000; if(s<60) return '방금'; if(s<3600) return Math.floor(s/60)+'분 전'; if(s<86400) return Math.floor(s/3600)+'시간 전'; return localTime(t); }
function errText(c){ return c==='auth'?'연결 토큰이 맞지 않습니다':(c==='timeout'||c==='network')?'PC 서버에 연결할 수 없습니다 (사내 와이파이, 서버 실행, 인증서 설치 확인)':'동기화 오류 ('+c+')'; }
function syncBadge(){
  if(!S.conn.url) return '';
  const st=S.syncState;
  const label= st==='busy'?'동기화 중': st==='ok'?`PC 동기화 ${ago(S.conn.lastSync)}`: st==='off'?`PC 연결 안 됨${S.conn.lastSync?' ('+ago(S.conn.lastSync)+' 동기화)':''}`:'PC 확인 중';
  return `<button class="sync ${st==='ok'?'on':st==='off'?'off':''}" data-act="sync" aria-label="지금 동기화"><i></i>${esc(label)}</button>`;
}
function connStatusText(){
  if(!S.conn.url) return '서버가 설정되지 않았습니다. 이 기기에만 저장됩니다.';
  if(S.syncState==='busy') return '동기화 중입니다.';
  const last=S.conn.lastSync?`마지막 동기화 ${localTime(S.conn.lastSync)}`:'아직 동기화하지 않았습니다.';
  return S.conn.lastError?`${errText(S.conn.lastError)}. ${last}`:last;
}
let syncTimer=null;
function scheduleSync(){ if(!S.conn.url) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>sync({silent:true}),1500); }
async function sync({silent=false}={}){
  if(!S.conn.url || S.syncing) return false;
  S.syncing=true; S.syncState='busy'; renderTop();
  try{
    const tomb=(await IDB.get('kv','tombstones'))||{};
    const body=JSON.stringify({lots:S.lots.map(({id,...l})=>l), tombstones:tomb, settings:S.settings});
    const r=await (await api('/api/sync',{method:'POST',body},30000)).json();
    const local=new Map((await IDB.all('lots')).map(l=>[l.id,l]));
    const srv=new Map((r.lots||[]).map(l=>[l.lotNo,l]));
    for(const [id,l] of srv){ const cur=local.get(id); if(!cur || (l.updatedAt||'')>=(cur.updatedAt||'')) await IDB.put('lots',{...l,id}); }
    for(const [id,l] of local){ if(!srv.has(id)){ const t=(r.tombstones||{})[id]; if(t && t>=(l.updatedAt||'')) await IDB.del('lots',id); } }
    await IDB.put('kv', r.tombstones||{}, 'tombstones');
    if(r.settings && (!S.settings || (r.settings.updatedAt||'')>=(S.settings.updatedAt||''))) await IDB.put('kv', r.settings, 'settings');
    await Store.load();
    const have=new Set(await IDB.keys('photos')), srvP=new Set(r.photos||[]); let up=0, down=0;
    for(const id of new Set(S.lots.flatMap(l=>l.photos||[]))){
      try{
        if(have.has(id) && !srvP.has(id)){ const rec=await IDB.get('photos',id); await api('/api/photos/'+encodeURIComponent(id),{method:'PUT',body:rec.blob,headers:{'Content-Type':rec.type||'image/jpeg'}},60000); up++; }
        else if(!have.has(id) && srvP.has(id)){ const b=await (await api('/api/photos/'+encodeURIComponent(id),{},60000)).blob(); await IDB.put('photos',{id,blob:b,type:b.type||'image/jpeg'}); down++; }
      }catch(e){}
    }
    await saveConn({lastSync:nowIso(), lastError:null}); S.syncState='ok';
    if(!silent) toast(`동기화 완료: LOT ${S.lots.length}건${up||down?`, 사진 보냄 ${up} 받음 ${down}`:''}`);
    return true;
  }catch(e){
    S.syncState='off'; await saveConn({lastError:(e&&e.code)||'error'});
    if(!silent) toast(errText(e&&e.code));
    return false;
  }finally{ S.syncing=false; afterSync(); }
}
function afterSync(){
  const r=parseRoute();
  if(r.v==='lot') return render();
  renderTop();
  if(r.v==='list' && $('#listBody')) listBody();
  const st=$('#connStatus'); if(st) st.textContent=connStatusText();
}
async function connTest(btn){
  const url=normUrl($('#c_url').value), token=$('#c_token').value.trim();
  await saveConn({url, token, lastError:null});
  $('#c_url').value=url;
  if(!url){ S.syncState='idle'; toast('서버 주소를 지웠습니다. 이 기기에만 저장합니다'); afterSync(); return; }
  btn.disabled=true;
  try{ const r=await (await api('/api/ping')).json(); toast(`연결됨: ${r.name||'PC'} (서버 LOT ${r.lots}건)`); await sync({silent:false}); }
  catch(e){ S.syncState='off'; await saveConn({lastError:(e&&e.code)||'error'}); toast(errText(e&&e.code)); afterSync(); }
  btn.disabled=false;
}

/* ---------- routing ---------- */
function parseRoute(){
  const p=(location.hash.slice(1)||'/').split('/').filter(Boolean);
  if(!p.length) return {v:'list'};
  if(p[0]==='new') return {v:'form',mode:'new'};
  if(p[0]==='settings') return {v:'settings'};
  const id=decodeURIComponent(p[1]||'');
  if(p[0]==='lot') return {v:'lot',id};
  if(p[0]==='edit') return {v:'form',mode:'edit',id};
  if(p[0]==='dup') return {v:'form',mode:'dup',id};
  return {v:'list'};
}
window.addEventListener('hashchange', ()=>{ render(); window.scrollTo(0,0); });

function renderTop(title, back){
  const r=parseRoute();
  const t = title ?? ({list:'사출 LOT 기록', settings:'설정', form: r.mode==='edit'?'LOT 수정':'새 LOT', lot:'LOT 상세'}[r.v]);
  const b = back ?? (r.v==='lot'||r.v==='form') ;
  $('#top').innerHTML = `${b?'<button class="back" data-act="back" aria-label="뒤로">‹ 뒤로</button>':''}<h1>${esc(t)}</h1>${syncBadge()}`;
  $$('.tab').forEach(a=>a.toggleAttribute('aria-current', false));
  const cur = r.v==='list'||r.v==='lot' ? 'list' : r.v==='settings' ? 'settings' : null;
  if(cur) $(`.tab[data-tab="${cur}"]`).setAttribute('aria-current','page');
}

function render(){
  const r=parseRoute(); renderTop();
  if(r.v==='list') return listView();
  if(r.v==='lot') return lotView(r.id);
  if(r.v==='form') return formView(r.mode, r.id);
  if(r.v==='settings'){ settingsView(); bindSettings(); return; }
}

      <div class="f"><label for="f_part">부품</label><select id="f_part">${partOpts.map(o=>`<option value="${esc(o.k)}" ${o.k===key?'selected':''}>${esc(o.label)}</option>`).join('')}${partOpts.length?'':'<option value="/">설정에서 부품을 추가하세요</option>'}</select></div>
      <div class="f"><label for="f_stage">차수</label><select id="f_stage" name="stage">${STAGES.map(s=>`<option ${s===l.stage?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="f"><label for="f_status">상태</label><select id="f_status" name="status">${STATUSES.map(s=>`<option ${s===l.status?'selected':''}>${s}</option>`).join('')}</select></div>
      ${inp('customer','고객',l.customer)}${inp('material','재료',l.material)}${inp('materialLot','재료 LOT',l.materialLot)}
      ${inp('mold','금형 번호',l.mold)}${inp('machine','사출기',l.machine)}${inp('cavity','캐비티',l.cavity)}${inp('operator','작업자',l.operator)}
    </div></section>

    <section class="sec"><h2>생산 수량</h2><div class="grid">
      ${inp('shots','총 쇼트',l.shots,'text','inputmode="numeric"')}${inp('good','양품',l.good,'text','inputmode="numeric"')}${inp('ng','불량',l.ng,'text','inputmode="numeric"')}
    </div><div class="yield" id="yieldOut"></div>
      <h3 style="margin-top:14px">불량 유형</h3>
      <div class="lot-meta" style="margin-top:0">${defectList.map(d=>`<button type="button" class="chip" data-act="defect" data-v="${esc(d)}" aria-pressed="${F.defects.has(d)}">${esc(d)}</button>`).join('')}</div>
    </section>

    <section class="sec"><h2>성형 조건 <button type="button" class="btn small" data-act="loadprev">직전 LOT 조건 불러오기</button></h2>
      ${groups.map(g=>`<h3>${esc(g||'기타')}</h3><div class="grid">${condList.filter(x=>x.g===g).map(x=>`<div class="f"><label>${esc(x.l)}</label><div class="u"><input data-cond="${esc(x.l)}" data-g="${esc(x.g)}" data-u="${esc(x.u)}" value="${esc(condVal(x.l))}" inputmode="decimal" aria-label="${esc(x.l)}"><span>${esc(x.u)}</span></div></div>`).join('')}</div>`).join('')}
      ${condList.length?'':'<p class="help">설정에서 조건 항목을 추가하세요.</p>'}
    </section>

    <section class="sec"><h2>치수 <span class="pill" id="dimSum"></span></h2><p class="help">성적서 평균값(PV, Ra는 최대값)을 입력하면 규격 판정이 바로 표시됩니다.</p><div id="dims"></div></section>

    <section class="sec"><h2>메모</h2><div class="f"><textarea id="f_memo" name="memo" placeholder="외관 이슈, 조건 변경 사유, 다음 차수 반영 사항" aria-label="메모">${esc(l.memo||'')}</textarea></div></section>

    <section class="sec"><h2>사진</h2><div id="photos"></div></section>

    <div class="btns"><button class="btn" data-act="back">취소</button><button class="btn primary" data-act="save">${mode==='edit'?'변경 저장':'LOT 저장'}</button></div>`;

  renderDims(); renderPhotos(); updYield();
  const lotIn=$('#f_lotNo');
  lotIn.addEventListener('input',()=>{ F.auto=false; });
  $('#f_date').addEventListener('change',e=>{ if(F.auto) lotIn.value=nextLotNo(e.target.value, F.origId); });
  $('#f_part').addEventListener('change',e=>{
    captureDims(); F.key=e.target.value;
    const p=cfg().parts.find(p=>partKey(p)===F.key); if(p){ $('#f_customer').value=p.customer; $('#f_material').value=p.material; }
    renderDims();
  });
  ['shots','good','ng'].forEach(n=>$(`#f_${n}`).addEventListener('input',updYield));
}
function currentDims(){
  if(F.snapKey && F.key===F.snapKey && F.snapDims?.length) return F.snapDims.map(d=>({name:d.name,nominal:d.nominal,plus:d.plus,minus:d.minus}));
  const p=cfg().parts.find(p=>partKey(p)===F.key); return p?p.dims.map(d=>({...d})):[];
}
function captureDims(){ $$('#dims input').forEach(i=>{ const v=num(i.value); if(v==null) delete F.dimVals[i.dataset.name]; else F.dimVals[i.dataset.name]=v; }); }
function renderDims(){
  const ds=currentDims(); const el=$('#dims');
  if(!ds.length){ el.innerHTML='<p class="help">이 부품에 등록된 치수 항목이 없습니다. 설정에서 추가하세요.</p>'; $('#dimSum').textContent=''; return; }
  el.innerHTML=ds.map((d,i)=>`<div class="dim"><div><div class="nm">${esc(d.name)}</div><div class="sp">${esc(specText(d))}</div></div>
    <input data-i="${i}" data-name="${esc(d.name)}" value="${esc(fmt(F.dimVals[d.name]))}" inputmode="decimal" aria-label="${esc(d.name)} 측정값"><span class="jd" id="jd${i}"></span></div>`).join('');
  $$('#dims input').forEach(i=>i.addEventListener('input',updJudges));
  updJudges();
}
function updJudges(){
  const ds=currentDims(); let n=0, ng=0;
  $$('#dims input').forEach(i=>{ const d={...ds[+i.dataset.i], value:num(i.value)}; const j=judge(d); const el=$('#jd'+i.dataset.i); el.textContent=j||''; el.className='jd '+(j||''); if(j){n++; if(j==='NG') ng++;} });
  const s=$('#dimSum'); s.textContent=n?`NG ${ng} / ${n}`:''; s.className='pill '+(n?(ng?'ng':'ok'):'');
}
function updYield(){
  const y=yieldOf({shots:num($('#f_shots').value), good:num($('#f_good').value), ng:num($('#f_ng').value)});
  $('#yieldOut').innerHTML = y!=null ? `수율 <b>${fmt(Math.round(y*10)/10)}%</b><div class="bar"><i style="width:${Math.max(0,Math.min(100,y))}%"></i></div>` : '양품과 불량을 입력하면 수율이 계산됩니다.';
}
function renderPhotos(){
  const el=$('#photos'); if(!el) return;
  el.innerHTML=`<div class="photos">${F.photos.map(p=>`<div class="ph"><img data-pid="${esc(p)}" alt="LOT 사진"><button class="x" data-act="rmphoto" data-id="${esc(p)}" aria-label="사진 빼기">×</button></div>`).join('')}
    <label class="ph addph" id="addph"><b>+</b>사진 추가<input type="file" accept="image/*" multiple hidden id="phInput"></label></div>`;
  hydratePhotos(el);
  $('#phInput').addEventListener('change', async e=>{
    const files=[...e.target.files]; if(!files.length) return;
    $('#addph').firstElementChild.textContent='…';
    for(const f of files){ try{ F.photos.push(await addPhoto(await compress(f))); }catch(err){ toast('사진을 저장하지 못했습니다'); } }
    renderPhotos();
  });
}
function compress(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{
      const s=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement('canvas');
      c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',0.82);
    }; img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
function loadPrev(){
  const cand=sorted().filter(l=>l.id!==F.origId);
  const prev=cand.find(l=>`${l.project}/${l.part}`===F.key)||cand[0];
  if(!prev){ toast('불러올 이전 LOT가 없습니다'); return; }
  let n=0;
  $$('[data-cond]').forEach(i=>{ const v=(prev.cond||[]).find(x=>x.l===i.dataset.cond)?.v; if(v!=null&&v!==''){ i.value=v; n++; } });
  ['materialLot','mold','machine','cavity'].forEach(k=>{ const el=$('#f_'+k); if(!el.value&&prev[k]) el.value=prev[k]; });
  toast(n?`${prev.lotNo} 조건 ${n}개를 불러왔습니다`:`${prev.lotNo}에 저장된 조건이 없습니다`);
}
async function saveForm(btn){
  const lotNo=$('#f_lotNo').value.trim().toUpperCase();
  if(!lotNo){ toast('LOT 번호를 입력하세요'); return; }
  if(!ID_OK.test(lotNo)){ toast('LOT 번호에는 영문, 숫자, - _ . 만 쓸 수 있습니다'); return; }
  if(lotNo!==F.origId && S.lots.some(l=>l.id===lotNo)){ toast(`${lotNo}는 이미 있습니다`); return; }
  captureDims();
  const [project,part]=(F.key||'/').split('/');
  const v=n=>$('#f_'+n).value.trim();
  const lot={ lotNo, date:v('date'), project, part, stage:v('stage'), status:v('status'),
    customer:v('customer'), material:v('material'), materialLot:v('materialLot'), mold:v('mold'), machine:v('machine'), cavity:v('cavity'), operator:v('operator'),
    shots:num(v('shots')), good:num(v('good')), ng:num(v('ng')), defects:[...F.defects],
    cond:$$('[data-cond]').map(i=>({g:i.dataset.g,l:i.dataset.cond,u:i.dataset.u,v:i.value.trim()})).filter(x=>x.v!==''),
    dims:currentDims().map(d=>({...d, value:F.dimVals[d.name]??null})),
    memo:$('#f_memo').value, photos:F.photos, createdAt:F.createdAt||nowIso(), updatedAt:nowIso() };
  btn.disabled=true;
  try{ const before=F.origId?(S.lots.find(x=>x.id===F.origId)?.photos||[]):[]; await Store.saveLot(lot, F.origId); for(const p of before) if(!lot.photos.includes(p)) await delPhoto(p); toast(F.mode==='edit'?'변경을 저장했습니다':'LOT를 저장했습니다'); history.replaceState(null,'','#/lot/'+encodeURIComponent(lotNo)); render(); }
  catch(e){ btn.disabled=false; toast('저장하지 못했습니다 ('+(e?.code||'오류')+'). 다시 시도하세요'); }
}

/* ---------- settings ---------- */

  const c=cfg();
  $('#main').innerHTML=`
    <section class="sec"><h2>LOT 번호</h2><p class="help">형식: 접두어-YYMMDD-일련번호. 사출일마다 001부터 시작합니다.</p>
      <div class="f"><label for="s_prefix">접두어</label><input id="s_prefix" value="${esc(c.prefix)}" autocapitalize="characters"></div>
      <p class="note">예: ${esc(`${c.prefix}-${today().replaceAll('-','').slice(2)}-001`)}</p></section>
    <section class="sec"><h2>부품과 치수 규격</h2><p class="help">[프로젝트 / 부품 / 고객 / 재료] 줄 아래에 ‘항목, 기준값, +공차, -공차’를 한 줄씩 적습니다. 상한만 있는 규격(PV 10㎛)은 ‘0, +10, 0’처럼 적습니다.</p>

    <section class="sec"><h2>성형 조건 항목</h2><p class="help">‘그룹 | 항목 | 단위’ 형식. 순서대로 입력 화면에 나옵니다.</p>
      <div class="f"><textarea class="code" id="s_conds" spellcheck="false" aria-label="성형 조건 항목">${esc(c.condsText)}</textarea></div></section>
    <section class="sec"><h2>불량 유형</h2><div class="f"><textarea id="s_defects" aria-label="불량 유형">${esc(c.defectsText)}</textarea></div></section>
    <div class="btns"><button class="btn primary" data-act="savesettings">설정 저장</button></div>
    <section class="sec" style="margin-top:18px"><h2>PC 동기화</h2>
      <p class="help">회사 PC에서 동기화 서버를 켜두면, 사내 와이파이에 연결된 상태에서 앱을 열거나 저장할 때마다 PC와 자동으로 맞춰집니다. 밖에서 기록한 내용은 휴대폰에 있다가 다음 연결 때 올라갑니다.</p>
      <div class="grid">
        <div class="f"><label for="c_url">서버 주소</label><input id="c_url" value="${esc(S.conn.url||'')}" placeholder="https://192.168.0.10:5443" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
        <div class="f"><label for="c_token">연결 토큰</label><input id="c_token" value="${esc(S.conn.token||'')}" placeholder="PC 서버 화면의 8자리" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
      </div>
      <div class="btns" style="margin-top:12px"><button class="btn" data-act="conntest">저장하고 연결 확인</button><button class="btn primary" data-act="syncnow">지금 동기화</button></div>
      <p class="note" id="connStatus">${esc(connStatusText())}</p></section>
    <section class="sec" style="margin-top:18px"><h2>데이터</h2>
      <p class="help">LOT ${S.lots.length}건이 이 기기의 브라우저 저장소에 있습니다. PC 동기화를 설정하지 않으면 어디로도 전송되지 않습니다. ${S.persisted===true?'영구 저장이 허용되어 브라우저가 임의로 지우지 않습니다.':S.persisted===false?'영구 저장이 허용되지 않았습니다. 홈 화면에 설치해서 쓰고, 백업을 자주 받아두세요.':''}</p>
      <div class="btns" style="flex-direction:column">
        <button class="btn wide" data-act="csv">엑셀용 CSV 내보내기</button>

      </div>

function bindSettings(){ const i=$('#restoreIn'); if(i) i.addEventListener('change',e=>{ const f=e.target.files[0]; if(f) importBackup(f); e.target.value=''; }); }
async function saveSettings(btn){
  const s={ prefix:($('#s_prefix').value.trim().toUpperCase()||'AGO'), partsText:$('#s_parts').value, condsText:$('#s_conds').value, defectsText:$('#s_defects').value };
  if(!ID_OK.test(s.prefix)){ toast('접두어에는 영문, 숫자, - _ . 만 쓸 수 있습니다'); return; }
  const n=parseParts(s.partsText).length;
  btn.disabled=true;
  try{ await Store.saveSettings(s); toast(`설정을 저장했습니다 (부품 ${n}종)`); }catch(e){ toast('설정을 저장하지 못했습니다'); }
  btn.disabled=false;
}
async function exportCsv(){
  const lots=sorted().reverse();
  const condCols=[...new Set(lots.flatMap(l=>(l.cond||[]).map(c=>c.l)))];
  const dimCols=[...new Set(lots.flatMap(l=>(l.dims||[]).filter(d=>d.value!=null).map(d=>d.name)))];
  const head=['LOT','사출일','프로젝트','부품','차수','상태','고객','재료','재료LOT','금형','사출기','캐비티','작업자','총쇼트','양품','불량','수율(%)','불량유형',...condCols,...dimCols,'치수NG항목','메모'];
  const q=v=>{ const s=v==null?'':String(v); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
  const rows=lots.map(l=>{ const y=yieldOf(l); const dm=Object.fromEntries((l.dims||[]).map(d=>[d.name,d]));
    return [l.lotNo,l.date,l.project,l.part,l.stage,l.status,l.customer,l.material,l.materialLot,l.mold,l.machine,l.cavity,l.operator,l.shots,l.good,l.ng,y!=null?fmt(Math.round(y*10)/10):'',(l.defects||[]).join('/'),
      ...condCols.map(c=>(l.cond||[]).find(x=>x.l===c)?.v??''), ...dimCols.map(n=>dm[n]?.value??''),
      (l.dims||[]).filter(d=>judge(d)==='NG').map(d=>d.name).join('/'), l.memo];
  });
  const csv='\uFEFF'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n');
  saveFile(`사출LOT_${today()}.csv`, new Blob([csv],{type:'text/csv;charset=utf-8'}));
}

/* ---------- events ---------- */
document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='back'){ if(history.length>1) history.back(); else location.hash='#/'; }
  else if(a==='filter'){ S.filter=b.dataset.v; $$('.chip[data-act="filter"]').forEach(c=>c.setAttribute('aria-pressed', c.dataset.v===S.filter)); listBody(); }
  else if(a==='defect'){ const v=b.dataset.v; F.defects.has(v)?F.defects.delete(v):F.defects.add(v); b.setAttribute('aria-pressed',F.defects.has(v)); }
  else if(a==='loadprev') loadPrev();
  else if(a==='save') saveForm(b);
  else if(a==='rmphoto'){ F.photos=F.photos.filter(p=>p!==b.dataset.id); renderPhotos(); }
  else if(a==='zoom'){ const o=document.createElement('div'); o.className='overlay'; o.innerHTML=`<img data-pid="${esc(b.dataset.id)}" alt="LOT 사진 크게 보기"><button class="btn">닫기</button>`; o.onclick=()=>o.remove(); document.body.appendChild(o); hydratePhotos(o); }
  else if(a==='del'){
    if(!b.dataset.armed){ b.dataset.armed='1'; b.textContent='한 번 더 누르면 삭제됩니다'; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent='LOT 삭제'; } },3000); return; }
    try{ await Store.deleteLot(b.dataset.id); toast('LOT를 삭제했습니다'); history.replaceState(null,'','#/'); render(); }catch(err){ toast('삭제하지 못했습니다'); }
  }
  else if(a==='savesettings') saveSettings(b);
  else if(a==='csv') exportCsv();
  else if(a==='backup') exportBackup();
  else if(a==='sync'||a==='syncnow'){ if(!S.conn.url){ toast('설정에서 PC 서버 주소를 먼저 입력하세요'); return; } sync({silent:false}); }
  else if(a==='conntest') connTest(b);
});

(async()=>{
  try{ await IDB.open(); await Store.load(); }
  catch(e){ $('#main').innerHTML='<div class="empty"><b>저장소를 열 수 없습니다</b>사생활 보호(시크릿) 모드에서는 저장이 되지 않습니다. 일반 모드로 열어주세요.</div>'; return; }
  S.conn=(await IDB.get('kv','conn'))||{};
  if(!S.conn.url && location.protocol==='https:' && !/github\.io$/.test(location.hostname)){
    try{ const r=await fetch('/api/ping',{cache:'no-store'}); if(r.ok) await saveConn({url:location.origin}); }catch(e){}
  }
  render(); cleanupPhotos();
  sync({silent:true});
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') sync({silent:true}); });
  window.addEventListener('online',()=>sync({silent:true}));
  try{ if(navigator.storage?.persist) S.persisted = await navigator.storage.persisted() || await navigator.storage.persist(); }catch(e){}
})();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
